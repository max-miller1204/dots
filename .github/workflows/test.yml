name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu covers the GNU userland + util-linux flock/script that dev
        # Macs can't test; macos covers BSD userland + discoteq flock.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # macOS pins /bin/bash at 3.2 and ships no flock. Install the command
      # runtime and lock dependency without changing the account login shell.
      - name: Install Bash command runtime and flock
        if: runner.os == 'macOS'
        run: brew install bash flock

      - name: Tool versions
        run: |
          bash --version | head -1
          command -v flock
          command -v script

      - name: Run test suites
        run: ./test/all
