name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          install: false

      - name: Install lint tools
        run: ./bin/dots pkg add actionlint@latest shellcheck@latest

      - name: Check GitHub Actions workflows
        run: actionlint

      - name: Check shell scripts
        run: |
          mapfile -d '' shell_files < <(
            find bin install migrations scripts test .github/scripts \
              -type f \( -name '*.sh' -o -perm -u=x \) -print0
          )
          shellcheck -s bash -x -e SC1091,SC2016,SC2034,SC2317 "${shell_files[@]}"

  test:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu covers the GNU userland + util-linux flock/script that dev
        # Macs can't test; macos covers BSD userland + discoteq flock.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # macOS pins /bin/bash at 3.2 and ships no flock. Install the command
      # runtime and lock dependency without changing the account login shell.
      - name: Install Bash command runtime and flock
        if: runner.os == 'macOS'
        run: brew install bash flock

      - name: Tool versions
        run: |
          bash --version | head -1
          command -v flock
          command -v script

      - name: Run test suites
        run: ./test/all
