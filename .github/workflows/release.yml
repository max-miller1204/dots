name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install Bash command runtime and flock
        if: runner.os == 'macOS'
        run: brew install bash flock

      - name: Run test suites
        run: ./test/all

      - name: Build and smoke-test release artifact
        run: ./scripts/build-release.sh "$GITHUB_REF_NAME" "${RUNNER_TEMP}/dist"

      - name: Upload tested release artifacts
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-artifacts
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error

  publish:
    needs: test
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download tested release artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-artifacts
          path: dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/dots-${GITHUB_REF_NAME#v}.tar.gz" \
            dist/install.sh \
            dist/SHA256SUMS \
            dist/dots-release.txt \
            --verify-tag \
            --generate-notes \
            --title "$GITHUB_REF_NAME"
