[settings]
minimum_release_age = "0s"

[tools]
bat = "latest"
claude = "2"
codex = "latest"
eza = "latest"
fastfetch = "latest"
fd = "latest"
fzf = "latest"
gh = "latest"
"github:can1357/oh-my-pi" = "latest"
"github:kunchenguid/no-mistakes" = "latest"
"github:scop/bash-completion" = { version = "latest", bin_path = ".mise-empty-bin" }
go = "latest"
gum = "latest"
herdr = "latest"
jq = "latest"
lazygit = "latest"
neovim = "latest"
node = "lts"
"npm:@playwright/cli" = "latest"
# Stepstone is this setup's own low-volume package; Aube otherwise refuses it.
"npm:stepstone" = { version = "latest", allow_low_downloads = true }
opencode = "latest"
pi = "latest"
python = "latest"
ripgrep = "latest"
starship = "latest"
tmux = "latest"
zoxide = "latest"
