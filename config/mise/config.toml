[settings]
minimum_release_age = "0s"

[tools]
actionlint = "latest"
bat = "latest"
claude = "latest"
codex = "latest"
direnv = "latest"
eza = "latest"
fastfetch = "latest"
fd = "latest"
fzf = "latest"
gh = "latest"
"github:can1357/oh-my-pi" = "latest"
"github:kunchenguid/no-mistakes" = "latest"
"github:scop/bash-completion" = { version = "latest", bin_path = "completions", strip_components = 1 }
go = "latest"
gum = "latest"
herdr = "latest"
jq = "latest"
lazygit = "latest"
neovim = "latest"
node = "lts"
"npm:@playwright/cli" = "0.1.18"
# Stepstone is this setup's own low-volume package; Aube otherwise refuses it.
"npm:stepstone" = { version = "latest", allow_low_downloads = true }
opencode = "latest"
pi = "latest"
python = "latest"
ripgrep = "latest"
shellcheck = "latest"
starship = "latest"
tmux = "latest"
zoxide = "latest"
